# /etc/nginx/conf.d/stroyka-https.conf
#
# Мини-апп за SNI-демуксом UK: :443 разбирает stream-блок nginx.conf по имени и
# отдаёт сюда, на 127.0.0.1:8443, с proxy_protocol. Домен подставить свой —
# см. deploy/README.md.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name plitka.mooo.com;

    ssl_certificate     /etc/letsencrypt/live/plitka.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plitka.mooo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Статика и JSON — всё отдаёт локальный uvicorn (stroyka-web.service).
    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
