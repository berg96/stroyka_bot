# /etc/nginx/conf.d/stroyka-http.conf
#
# Только для выписки сертификата и редиректа. Telegram открывает мини-апп
# исключительно по https, так что жить на :80 ему незачем.
server {
    listen 80;
    listen [::]:80;
    server_name plitka.mooo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
