[project]
name = "stroyka-bot"
version = "0.1.0"
description = "Телеграм-помощник плиточника: раскладка, материалы, смета"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.20.0",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "pillow==11.0.0",
    "reportlab==4.2.5",
    "loguru==0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilebot"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
